<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Admin — Liquif Picture</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>

<main class="auth">
  <aside class="side">
    <a class="logo" href="index.html" style="margin:0"><i></i>liquif <small>Picture</small></a>
    <div class="blob ph"></div>
    <q>Di balik setiap foto indah, ada pengelolaan yang <em>rapi</em>.</q>
  </aside>
  <section class="form" style="padding-block:60px">
    <div class="eyebrow">Area Admin</div>
    <h2>Selamat <em>datang</em> kembali</h2>
    <div class="fld"><label>Email</label><input type="email" placeholder="admin@liquifpicture.com" data-vt="email" required></div>
    <div class="fld"><label>Password</label><input type="password" placeholder="••••••••" data-vt="min" data-min="6" required></div>
    <div class="acts" style="align-items:center;justify-content:space-between;margin-top:8px">
      <button class="btn ink" data-act="login" data-scope=".form">Masuk</button>
      <a class="lnk" href="#" data-open="m-lupa">Lupa password?</a>
    </div>
    <p style="margin-top:50px"><a class="lnk" href="index.html">← Kembali ke situs</a></p>
  </section>
</main>

<div class="ov" id="m-lupa"><div class="md" data-clear><button class="x" data-close>×</button>
  <div class="eyebrow">Pemulihan</div><h3>Lupa password</h3>
  <div class="fld"><label>Email terdaftar</label><input type="email" placeholder="admin@liquifpicture.com" data-vt="email" required></div>
  <p class="note">Tautan untuk mengatur ulang password akan dikirim ke email Anda.</p>
  <div class="acts"><button class="btn ink" data-ok="Tautan terkirim|Periksa kotak masuk dan folder spam email Anda. Tautan berlaku 30 menit.">Kirim tautan</button></div></div></div>

<script src="js/app.js"></script></body></html>
