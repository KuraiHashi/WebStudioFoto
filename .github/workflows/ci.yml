# Simpan sebagai: .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Batalkan run lama jika ada push baru ke branch yang sama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan PHP 8.3 (sesuai composer.json)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, ctype, tokenizer, xml, dom, curl, zip, bcmath, intl, gd
          coverage: none

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"   # VERIFIKASI: cocokkan dengan syarat Node untuk Vite 8
          cache: npm

      - name: Cache dependensi Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env untuk CI
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install dan build aset frontend
        run: |
          npm ci
          npm run build

      # Sementara tidak memblokir. Hapus baris continue-on-error
      # setelah kode lama selesai dirapikan dengan: vendor/bin/pint
      - name: Cek gaya kode (Pint)
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Jalankan test
        run: php artisan test