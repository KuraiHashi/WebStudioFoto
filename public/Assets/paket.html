<!DOCTYPE html>

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Detail Paket — Liquif Picture</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body data-pg="paket">
        <nav class="solid">
            <div class="wrap">
                <a class="logo" href="index.html"
                    ><i></i>liquif <small>Picture</small></a
                >
                <div class="menu">
                    <a class="l" href="index.html#profil">Profil</a
                    ><a class="l" href="index.html#galeri">Galeri</a
                    ><a class="l" href="index.html#paket">Paket</a
                    ><a class="l" href="index.html#testimoni">Testimoni</a
                    ><a class="l" href="index.html#kontak">Kontak</a>
                    <a class="btn sm" href="cek.html">Cek Reservasi</a
                    ><a class="btn sm gold" href="reservasi.html">Reservasi</a>
                </div>
                <button class="bg" aria-label="Menu">
                    <i></i><i></i><i></i>
                </button>
            </div>
        </nav>
        <main class="pg">
            <div class="wrap">
                <div class="crumb">
                    <a href="index.html#paket">Paket</a> / Detail
                </div>
                <div class="det">
                    <div
                        class="ph b"
                        style="
                            aspect-ratio: 4/5;
                            border-radius: 4px 4px 4px 110px;
                            max-height: 560px;
                            width: 100%;
                        "
                    ></div>
                    <div>
                        <div class="eyebrow">Detail Paket</div>
                        <h1 id="pk-n" style="margin: 14px 0 8px"></h1>
                        <div
                            id="pk-h"
                            style="
                                font: 500 36px var(--serif);
                                color: var(--bronze);
                            "
                        ></div>
                        <p
                            class="lead"
                            id="pk-x"
                            style="margin: 14px 0 24px"
                        ></p>
                        <div class="kv">
                            <i>Durasi</i><span id="pk-d"></span><i>Fasilitas</i
                            ><span id="pk-f"></span><i>Bonus</i
                            ><span id="pk-b"></span>
                        </div>
                        <div class="acts">
                            <a class="btn ink" id="pk-go" href="reservasi.html"
                                >Reservasi paket ini</a
                            ><a class="btn" href="index.html#paket"
                                >Semua paket</a
                            >
                        </div>
                    </div>
                </div>
                <div class="eyebrow" style="margin: 56px 0 16px">
                    Paket lainnya
                </div>
                <div class="chips" id="pk-ch"></div>
            </div>
        </main>
        <footer style="padding: 50px 0 30px">
            <div class="wrap">
                <div class="copy" style="margin: 0; padding: 0; border: 0">
                    <span>© Liquif Picture</span
                    ><a href="login.html">Login Admin</a>
                </div>
            </div>
        </footer>
        <script src="js/app.js"></script>
